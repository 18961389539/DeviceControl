name: DeviceControl software checks
on:
  push:
  pull_request:
jobs:
  contract-and-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Install Linux browser system dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - name: Run V2.0 strict release gate
        run: python tools/release_gate_v20.py --profile release
      - name: Run extended Chromium regression
        run: |
          python tests/test_browser_v10.py
          python tests/test_browser_v12.py
          python tests/test_browser_v13.py
          python tests/test_browser_v14.py
          python tests/test_browser_v15.py
          python tests/test_browser_v15_latest.py
          python tests/test_browser_v16.py
          python tests/test_browser_v16_conflict.py
          python tests/test_browser_v17.py
          python tests/test_browser_v17_compat_v15_latest.py
          python tests/test_browser_v17_compat_v16.py
          python tests/test_browser_v17_compat_v16_conflict.py

          python tests/test_browser_v18.py
          python tests/test_browser_v18_compat_v17.py
          python tests/test_browser_v18_compat_v16.py
          python tests/test_browser_v19.py
